name: cesium_3d_tiles_sample_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  thermion_flutter: ^0.3.2
  thermion_dart: ^0.3.2
  cupertino_icons: ^1.0.8
  logging: ^1.3.0
  cesium_3d_tiles:
    path: ../../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

